[package]
name = "dead-air-engine"
version = "0.3.0"
edition = "2021"
description = "Audio engine of Dead Air Watchdog: sound cards and streams, RMS level, silence detector"
license = "MIT"
authors = ["Graziano Melzi <hello@onairgarage.com>"]

[dependencies]
cpal = "0.18.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "ogg", "vorbis", "flac", "wav", "pcm", "isomp4"] }
symphonia-opus = "0.1.2"
ureq = "3.5.2"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
