name: Build installers

on:
  push:
    tags: ['v*']
  # Start from the Actions tab (or from a chat) with a version to build AND publish the release:
  # the tag is created by GitHub on the tip of main. Without a version it only builds.
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (the one in package.json, for example 26.11.4). Empty = build only. Versions starting with 0. are published as pre-releases."
        required: false
        default: ""

jobs:
  # A release must carry the version in package.json, and it must be higher than the latest
  # release: the in-app update check only offers strictly newer versions.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package.json and is newer than the latest release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$RELEASE_VERSION" ]; then
            TAG="${RELEASE_VERSION#v}"
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::A release started by hand must run on main (this run is on $GITHUB_REF_NAME)"; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$TAG" >/dev/null 2>&1; then
              echo "::error::Tag v$TAG already exists: use a higher version, or delete the unused tag first"; exit 1
            fi
          fi
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"; exit 1
          fi
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          LATEST="${LATEST#v}"
          echo "package.json: $VERSION  latest release: ${LATEST:-none}"
          if [ -n "$LATEST" ]; then
            node -e '
              const p = (v) => v.split(".").map((n) => parseInt(n, 10) || 0);
              const [a, b] = [p(process.argv[1]), p(process.argv[2])];
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const d = (a[i] || 0) - (b[i] || 0);
                if (d) process.exit(d > 0 ? 0 : 1);
              }
              process.exit(1);
            ' "$VERSION" "$LATEST" || { echo "::error::Version $VERSION must be greater than the latest release $LATEST"; exit 1; }
          fi

  # The user manual in English, Italian and Spanish, as three PDFs attached to the release (apps/STANDARD.md).
  manuals:
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the three manuals
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p manuals
          python3 docs/manual/build.py "$VERSION" manuals
          ls -l manuals
      - name: Upload manuals artifact
        uses: actions/upload-artifact@v7
        with:
          name: dead-air-watchdog-manuals
          path: manuals/*.pdf
          if-no-files-found: error
          retention-days: 1

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            command: npm run dist:win
            artifact: release/*.exe
          - os: macos-latest
            name: macos
            command: npx electron-builder --mac --x64 --arm64
            artifact: release/*.dmg
          - os: ubuntu-latest
            name: linux
            command: npm run dist:linux
            artifact: release/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Sound library headers (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # The audio engine (Rust) goes inside the app as engine/dist/<os>-<arch>/, which electron-builder copies to resources/engine.
      - name: Build the audio engine
        run: |
          set -e
          case "${{ matrix.name }}" in
            windows)
              cargo build --release --manifest-path engine/Cargo.toml
              mkdir -p engine/dist/win-x64
              cp engine/target/release/dead-air-engine.exe engine/dist/win-x64/
              ;;
            linux)
              cargo build --release --manifest-path engine/Cargo.toml
              mkdir -p engine/dist/linux-x64
              cp engine/target/release/dead-air-engine engine/dist/linux-x64/
              ;;
            macos)
              rustup target add aarch64-apple-darwin x86_64-apple-darwin
              cargo build --release --manifest-path engine/Cargo.toml --target aarch64-apple-darwin
              cargo build --release --manifest-path engine/Cargo.toml --target x86_64-apple-darwin
              mkdir -p engine/dist/mac-arm64 engine/dist/mac-x64
              cp engine/target/aarch64-apple-darwin/release/dead-air-engine engine/dist/mac-arm64/
              cp engine/target/x86_64-apple-darwin/release/dead-air-engine engine/dist/mac-x64/
              ;;
          esac
          find engine/dist -type f -exec ls -l {} \;

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.name }} installer
        run: ${{ matrix.command }}
        env:
          # No signing certificates. The macOS app still gets an ad-hoc signature (dev/sign-adhoc.cjs):
          # without a valid one an Apple Silicon Mac says the app is "damaged".
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # The engine must be inside the packaged app, and it must start on this machine.
      - name: Check the engine inside the packaged app
        run: |
          set -e
          case "${{ matrix.name }}" in
            windows) E=$(ls release/win-unpacked/resources/engine/dead-air-engine.exe) ;;
            linux) E=$(ls release/linux-unpacked/resources/engine/dead-air-engine) ;;
            macos) E=$(ls release/mac-arm64/*.app/Contents/Resources/engine/dead-air-engine) ;;
          esac
          echo "$E"
          "$E" --version

      - name: Check the signature of the apps inside the macOS disk images
        if: matrix.name == 'macos'
        run: |
          set -e
          for dmg in release/*.dmg; do
            MNT=$(mktemp -d)
            hdiutil attach "$dmg" -mountpoint "$MNT" -nobrowse -readonly -quiet
            APP=$(ls -d "$MNT"/*.app | head -1)
            echo "== $dmg"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier" || true
            test -x "$APP/Contents/Resources/engine/dead-air-engine"
            hdiutil detach "$MNT" -quiet
          done

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: dead-air-watchdog-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1  # only needed to hand files to the release job; keeps Actions storage near zero

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != '')
    needs: [build, manuals]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # versions 0.x are tests: published as pre-releases, which the update check of the apps ignores
          prerelease: ${{ startsWith(github.event.inputs.release_version, '0.') || startsWith(github.event.inputs.release_version, 'v0.') || (github.event.inputs.release_version == '' && startsWith(github.ref_name, 'v0.')) }}
          # tag pushed: its own name; started by hand: v<version>, created by GitHub on this commit
          tag_name: ${{ github.event.inputs.release_version != '' && format('v{0}', github.event.inputs.release_version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
